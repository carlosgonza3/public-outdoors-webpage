<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>PUBLIC — Próximamente</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #f7f5ef; color: #161916; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
      main { min-height: 100vh; min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 2.5rem; padding: 2rem; }
      button { display: grid; place-items: center; width: clamp(110px, 18vw, 180px); aspect-ratio: 1; padding: 0; border: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 2px solid #161916; outline-offset: 16px; border-radius: 12px; }
      img { display: block; width: 82%; height: auto; }
      h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
      @media (max-width: 767px) {
        h1 { font-size: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <button type="button" aria-label="logo PUBLIC"><img src="/logo.svg" alt="PUBLIC" width="144" height="160" /></button>
      <h1>Próximamente</h1>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
